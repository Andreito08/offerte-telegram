name: Controlla offerte
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      ripassa:
        description: "Prova: rivaluta gli ultimi N post per canale (0 = normale)"
        default: "0"
concurrency: offerte
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: Prova token Claude (solo avvio manuale)
        if: github.event_name == 'workflow_dispatch'
        run: claude -p --model haiku "Rispondi solo con la parola ok"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - run: python check.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RIPASSA: ${{ inputs.ripassa }}
      - name: Salva stato
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json storico.json
          git diff --cached --quiet || (git commit -m "stato" && git push)
